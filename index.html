<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Точка опоры — Альбом</title>
<style>
  :root{
    --bg:#f0f7ff; 
    --bg2:#e0efff;
    --card:#ffffff;
    --accent:#5a9cf8; 
    --accent2:#3b7ae0;
    --text:#2c3e50; 
    --muted:#7f8c8d;
    --glow:rgba(90,156,248,.25);
  }
  
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  *{box-sizing:border-box;margin:0;padding:0}
  
  body{
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
    color:var(--text); min-height:100vh; display:flex; flex-direction:column;
    align-items:center; padding:24px 16px 48px; gap:24px;
    width: 100%; max-width: 100vw; overflow-x: hidden;
    -webkit-user-select: none; user-select: none; line-height: 1.5;
  }

  .album { text-align:center; display:flex; flex-direction:column; align-items:center; gap:16px; width:100%; max-width:600px; }
  .album__cover { width:min(280px,72vw); aspect-ratio:1/1; border-radius:24px; object-fit:cover; box-shadow:0 20px 50px var(--glow); border:4px solid #fff; pointer-events: none; }
  .album__title { font-size:clamp(26px,6vw,44px); font-weight:800; letter-spacing:-.02em; color: var(--text); line-height: 1.1; }
  .album__sub { color:var(--accent); font-size:16px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; }

  .carousel { width:100%; max-width:960px; display:flex; gap:20px; overflow-x:auto; padding:10px 8px 20px; scroll-snap-type:x mandatory; scrollbar-width:thin; scrollbar-color:var(--accent) transparent; }
  .carousel::-webkit-scrollbar { height:6px; }
  .carousel::-webkit-scrollbar-thumb { background:var(--accent); border-radius:4px; }
  
  .track { flex:0 0 auto; width:190px; scroll-snap-align:center; background:var(--card); border-radius:20px; padding:12px; cursor:pointer; transition:transform .2s, box-shadow .2s; border:1px solid rgba(90,156,248,.1); text-align:center; display: flex; flex-direction: column; box-shadow: 0 4px 15px rgba(0,0,0,0.03);}
  .track:hover { transform:translateY(-6px); box-shadow: 0 12px 25px var(--glow); }
  .track.active { border:2px solid var(--accent); box-shadow:0 10px 25px var(--glow); }
  
  .track__cover { width:100%; aspect-ratio:1/1; border-radius:14px; object-fit:cover; display:block; margin-bottom:12px; background:var(--bg2); pointer-events: none; flex-shrink: 0;}
  
  .track__num { font-size:11px; color:var(--accent); font-weight:800; letter-spacing:.1em; margin-bottom:4px; text-transform: uppercase; }
  .track__name { font-size:14px; font-weight:700; margin-bottom:6px; line-height: 1.2; }
  .track__desc { font-size:12px; color:var(--muted); line-height: 1.3; flex-grow: 1; }

  .player { width:100%; max-width:600px; background:var(--card); border-radius:24px; padding:24px; display:flex; flex-direction:column; gap:16px; box-shadow:0 15px 50px rgba(0,0,0,.08); border:1px solid rgba(90,156,248,.15); position: sticky; bottom: 10px; z-index: 10;}
  .player__now { display:flex; align-items:center; gap:16px; }
  .player__cover { width:70px; height:70px; border-radius:16px; object-fit:cover; background:var(--bg2); border:2px solid #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.05); pointer-events: none; }
  .player__info { overflow:hidden; flex:1; }
  .player__title { font-weight:700; font-size:16px; line-height:1.25; margin-bottom:2px; }
  .player__artist { color:var(--muted); font-size:13px; }
  .player audio { width:100%; outline: none; }
  
  .player__nav { display:flex; justify-content:center; gap:16px; }
  .player__nav button { background:var(--accent); border:none; color:#fff; padding:12px 24px; border-radius:30px; font-weight:700; font-size:14px; cursor:pointer; transition:background 0.3s; box-shadow: 0 4px 15px var(--glow);}
  .player__nav button:hover { background:var(--accent2); }
</style>
</head>
<body>

  <section class="album">
    <img class="album__cover" id="albumCover" src="cover.jpg" alt="Обложка альбома">
    <h1 class="album__title">Точка опоры</h1>
    <p class="album__sub">Новый альбом</p>
  </section>

  <div class="carousel" id="carousel"></div>

  <div class="player">
    <div class="player__now">
      <img class="player__cover" id="playerCover" src="cover.jpg" alt="Cover">
      <div class="player__info">
        <div class="player__title" id="playerTitle">Выбери песню</div>
        <div class="player__artist" id="playerArtist">Точка опоры</div>
      </div>
    </div>
    <audio id="audio" controls controlslist="nodownload" preload="none"></audio>
    <div class="player__nav">
      <button id="prevBtn">⏮ Пред</button>
      <button id="nextBtn">След ⏭</button>
    </div>
  </div>

<script>
  const album = {
    title: "Точка опоры",
    cover: "cover.jpg",
    tracks: [
      { id: 1, name: "Маленькие чудеса", desc: "Гимн любви к себе и умению замечать хорошее." },
      { id: 2, name: "Сила одного дня", desc: "Мотивация жить сегодняшним днем." },
      { id: 3, name: "Свет твоих друзей", desc: "О важности поддержки." },
      { id: 4, name: "Человек-опора", desc: "О том, как важно найти того, кто укроет от бурь." },
      { id: 5, name: "Редкий дар", desc: "О встрече с тем самым человеком." },
      { id: 6, name: "За всё, что есть в тебе", desc: "Признание в любви без лишних слов." },
      { id: 7, name: "Без лишних рамок и границ", desc: "О принятии друг друга." },
      { id: 8, name: "Поступок", desc: "О мужской ответственности и защите." },
      { id: 9, name: "Крепость и Свет", desc: "О надежности и тихом счастье." },
      { id: 10, name: "Право на счастье", desc: "О благородном умении отпускать." }
    ]
  };

  let currentTrack = -1;

  const carousel    = document.getElementById('carousel');
  const audio       = document.getElementById('audio');
  const playerCover = document.getElementById('playerCover');
  const playerTitle = document.getElementById('playerTitle');

  const pad = (n) => String(n).padStart(2,'0');
  
  // Картинки берутся строго по ID песни (01, 02, 03...)
  const coverPath = (id) => `covers/${pad(id)}.jpg`;
  const songPath  = (id) => `${pad(id)}.mp3`;

  function renderCarousel(){
    carousel.innerHTML = '';
    album.tracks.forEach((t, i) => {
      const el = document.createElement('div');
      el.className = 'track' + (i === currentTrack ? ' active' : '');
      el.dataset.index = i;
      el.innerHTML = `
        <img class="track__cover" src="${coverPath(t.id)}" alt="${t.name}">
        <div class="track__num">ТРЕК №${t.id}</div>
        <div class="track__name">${t.name}</div>
        <div class="track__desc">${t.desc}</div>
      `;
      el.addEventListener('click', () => play(i));
      carousel.appendChild(el);
    });
  }

  function play(i){
    if (i < 0) i = album.tracks.length - 1;
    if (i >= album.tracks.length) i = 0;

    currentTrack = i;
    const t = album.tracks[i];

    playerCover.src = coverPath(t.id);
    playerTitle.textContent = t.name;

    [...carousel.querySelectorAll('.track')].forEach((el, idx) => el.classList.toggle('active', idx === i));
    carousel.children[i]?.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});

    audio.src = songPath(t.id);
    audio.play().catch(()=>{});
  }

  document.getElementById('prevBtn').onclick = () => play(currentTrack - 1);
  document.getElementById('nextBtn').onclick = () => play(currentTrack + 1);
  audio.addEventListener('ended', () => play(currentTrack + 1));

  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('dragstart', e => e.preventDefault());

  renderCarousel();
</script>
</body>

  renderCarousel();
</script>
</body>
</html>
